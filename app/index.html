<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathfold</title>
<meta name="description" content="Guided breathing with live heart rate, breath-by-breath heart rate swing and a before/after check.">
<meta name="theme-color" content="#0a1619">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400&display=swap">
<style>
  /* Layout: one full-bleed canvas; a quiet word below the figure; controls (with the live pulse)
     drift up from the bottom edge and fade when idle; results float in a card. */
  :root {
    --night: #0a1619;
    --night-2: #10232a;
    --moon: #e4ece6;
    --glow: #9fd4c4;
    --ember: #e8a08f;
    --dim: rgba(228, 236, 230, 0.5);
    --hair: rgba(228, 236, 230, 0.14);
    --font-word: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --font-ui: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--night-2), var(--night) 70%);
    background-color: var(--night);
    color: var(--moon);
    overflow: hidden;
    font: 14px/1.4 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body.idle { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #rest { opacity: 0; transition: opacity 3s ease; pointer-events: none; }
  #rest.on { opacity: 1; }
  body.resting .word, body.resting .count { text-shadow: 0 0 18px rgba(10, 22, 25, 0.9); }

  .cue {
    position: fixed; left: 0; right: 0; top: 78%;
    display: grid; justify-items: center; gap: 0.6rem;
    pointer-events: none; padding-inline: 16px; text-align: center;
  }
  .word {
    font-family: var(--font-word); font-style: italic; font-weight: 400;
    font-size: clamp(1.6rem, 3.4vw, 2.4rem); letter-spacing: 0.02em;
    color: var(--moon); opacity: 0.82; text-wrap: balance;
    transition: opacity 0.9s ease;
  }
  .word.fading { opacity: 0; }
  .count {
    font-size: 0.78rem; letter-spacing: 0.3em; color: var(--dim);
    font-variant-numeric: tabular-nums; font-weight: 300;
  }

  .pulse {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-variant-numeric: tabular-nums; color: var(--dim); letter-spacing: 0.06em;
  }
  .pulse b { font-weight: 400; color: var(--moon); font-size: 0.95rem; letter-spacing: 0; }
  .pulse i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ember);
    align-self: center; opacity: 0.35; transform: scale(0.8);
  }

  .panel {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(760px, calc(100% - 32px));
    display: grid; gap: 14px;
    padding: 16px 18px;
    background: rgba(10, 22, 25, 0.78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hair); border-radius: 14px;
    font-size: 0.72rem; color: var(--dim);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  body.idle .panel { opacity: 0; transform: translateX(-50%) translateY(10px); pointer-events: none; }

  .sliders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label { display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.12em; }
  .field output { color: var(--moon); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  input[type="range"] { width: 100%; accent-color: var(--glow); margin: 0; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { border-top: 1px solid var(--hair); padding-top: 14px; }
  .row .spacer { flex: 1; }
  .row .lab { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* option text says it all; label stays for screen readers */
  button, select {
    font: inherit; color: var(--moon); background: transparent;
    border: 1px solid var(--hair); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; letter-spacing: 0.06em;
  }
  select { border-radius: 8px; background: var(--night); }
  button:hover:not(:disabled), select:hover { border-color: var(--dim); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; }
  button.primary { border-color: var(--glow); color: var(--glow); }
  button.heart.on { border-color: var(--ember); color: var(--ember); }
  .sliders.auto input[type="range"] { opacity: 0.4; }
  .autonote { grid-column: span 2; align-self: end; letter-spacing: 0.06em; padding-bottom: 1px; }
  .stat, .hrstatus { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
  .hrstatus { min-width: 0; }

  .results {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: rgba(6, 14, 16, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    overflow-y: auto; user-select: text;
  }
  .card {
    width: min(560px, 100%);
    background: var(--night-2); border: 1px solid var(--hair); border-radius: 16px;
    padding: 24px; display: grid; gap: 20px;
  }
  .card h2 {
    margin: 0; font-family: var(--font-word); font-style: italic; font-weight: 400;
    font-size: 1.9rem; letter-spacing: 0.01em; text-wrap: balance;
  }
  .card .when { color: var(--dim); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .compare { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px 18px; align-items: baseline; }
  .compare .h { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; }
  .compare .k { color: var(--dim); font-size: 0.75rem; }
  .compare .v { font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 300; }
  .compare .v small { font-size: 0.7rem; color: var(--dim); margin-left: 4px; }
  .delta { font-size: 0.85rem; line-height: 1.6; }
  .delta .up { color: var(--glow); }
  .delta .down { color: var(--ember); }
  .note { color: var(--dim); font-size: 0.75rem; line-height: 1.55; max-width: 62ch; }
  .chart svg { width: 100%; height: auto; display: block; }
  .history { width: 100%; border-collapse: collapse; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .history th { text-align: left; font-weight: 400; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.65rem; padding-bottom: 6px; }
  .history td { padding: 5px 0; border-top: 1px solid var(--hair); }
  .history td:not(:first-child), .history th:not(:first-child) { text-align: right; }
  .card .actions { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 640px) {
    .panel { padding: 12px 14px; gap: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    .row + .row { padding-top: 10px; }
    .row { gap: 6px; }
    button, select { padding: 5px 10px; }
    .sliders { gap: 10px 14px; }
    .hrstatus { flex-basis: 100%; order: 5; }
    .cue { top: 70%; }
    .card { padding: 18px; }
    .compare .v { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .word, .panel { transition: none; }
  }
</style>
</head>
<body>

<canvas id="c" aria-hidden="true"></canvas>
<canvas id="rest" aria-hidden="true"></canvas>


<div class="cue" aria-live="polite">
  <div class="word" id="word">breathe in</div>
  <div class="count" id="count">4</div>
</div>

<div class="panel" id="panel">
  <div class="sliders" id="sliders">
    <div class="field"><label for="s-in">Inhale <output id="o-in">4s</output></label><input id="s-in" type="range" min="1" max="12" step="0.5" value="4"></div>
    <div class="field" id="f-hi"><label for="s-hi"><span id="l-hi">Hold</span> <output id="o-hi">4s</output></label><input id="s-hi" type="range" min="0" max="12" step="0.5" value="4"></div>
    <div class="field"><label for="s-out">Exhale <output id="o-out">4s</output></label><input id="s-out" type="range" min="1" max="16" step="0.5" value="4"></div>
    <div class="field" id="f-ho"><label for="s-ho">Rest <output id="o-ho">4s</output></label><input id="s-ho" type="range" min="0" max="12" step="0.5" value="4"></div>
    <div class="autonote" id="autonote" hidden></div>
  </div>
  <div class="row">
    <button id="play" class="primary" type="button">Pause</button>
    <label class="lab" for="pattern">Pattern</label>
    <select id="pattern">
      <option value="gentle">Gentle start · 3 in, 4 out</option>
      <option value="coherent">Coherent · 5.5 in, 5.5 out</option>
      <option value="longout6">Long out · 4 in, 6 out</option>
      <option value="longout5">Slow long out · 4 in, 8 out</option>
      <option value="sigh">Cyclic sigh · in, sip, long out</option>
      <option value="box">Box · 4, 4, 4, 4</option>
      <option value="478">4·7·8</option>
      <option value="custom">Custom</option>
      <optgroup label="Guided by heart rate">
        <option value="adaptive">Settle heart rate · adapts to you</option>
        <option value="justrest">Just rest · no pacer</option>
      </optgroup>
    </select>
    <select id="shape" aria-label="Shape">
      <option value="5,2">Pentagram</option>
      <option value="7,3">Heptagram</option>
      <option value="9,4">Enneagram</option>
      <option value="12,5">Dodecagram</option>
      <option value="poly" selected>Polygons</option>
    </select>
    <span class="spacer"></span>
    <span class="stat" id="stat">0 breaths · 0:00</span>
    <button id="fs" type="button">Full screen</button>
    <button id="install" type="button" hidden>Install</button>
  </div>
  <div class="row">
    <button id="connect" class="heart" type="button">Connect heart rate</button>
    <span class="pulse" id="pulse" hidden aria-live="off"><i id="beat"></i><b id="bpm">--</b>bpm<span id="swing"></span></span>
    <span class="hrstatus" id="hrstatus">Fitbit Air, chest strap or watch</span>
    <span class="spacer"></span>
    <label class="lab" for="len">Session</label>
    <select id="len">
      <option value="180">3 min session</option>
      <option value="300" selected>5 min session</option>
      <option value="600">10 min session</option>
      <option value="900">15 min session</option>
      <option value="0">Until I stop</option>
    </select>
    <label class="lab" for="measure">Before &amp; after</label>
    <select id="measure">
      <option value="60">1 min rest before/after</option>
      <option value="120" selected>2 min rest before/after</option>
      <option value="0">No rest check</option>
    </select>
    <button id="easy" type="button" hidden>Easier</button>
    <button id="session" class="primary" type="button">Begin session</button>
  </div>
</div>

<div class="results" id="results" hidden>
  <div class="card" role="dialog" aria-labelledby="r-title">
    <div>
      <div class="when" id="r-when"></div>
      <h2 id="r-title">Session complete</h2>
    </div>
    <div class="compare" id="r-compare"></div>
    <div class="delta" id="r-delta"></div>
    <div class="chart" id="r-chart"></div>
    <p class="note" id="r-note"></p>
    <div id="r-history"></div>
    <div class="actions">
      <button id="r-close" class="primary" type="button">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const wordEl = $('word'), countEl = $('count');
  const sliders = { in: $('s-in'), hi: $('s-hi'), out: $('s-out'), ho: $('s-ho') };
  const outs = { in: $('o-in'), hi: $('o-hi'), out: $('o-out'), ho: $('o-ho') };
  const css = getComputedStyle(document.documentElement);
  const MOON = css.getPropertyValue('--moon').trim();
  const GLOW = css.getPropertyValue('--glow').trim();

  // ---- settings
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  // storage keys keep the app's old name so existing settings and history carry over
  const saved = store.get('unfolding-star', null);
  if (saved) {
    for (const k in sliders) if (saved[k] != null) sliders[k].value = saved[k];
    for (const id of ['shape', 'len', 'measure']) if (saved[id] != null) $(id).value = saved[id];
  }
  let star = $('shape').value.split(',').map(Number);
  // the user's own slider values; the adaptive mode borrows the sliders for display only
  const manual = { in: sliders.in.value, hi: sliders.hi.value, out: sliders.out.value, ho: sliders.ho.value };
  const lens = saved?.lens || {};          // session length remembered per mode
  const save = () => store.set('unfolding-star', {
    ...manual, shape: $('shape').value, len: $('len').value, measure: $('measure').value,
    pattern: $('pattern').value, lens: { ...lens, [curMode]: $('len').value },
  });

  // Modes live in the pattern list: a fixed pattern, "Settle heart rate" (pacer follows heart rate) or "Just rest".
  const MODES = { adaptive: 1, justrest: 1 };
  const mode = () => MODES[$('pattern').value] ? $('pattern').value : 'pattern';
  const BEGIN = { pattern: 'Begin session', adaptive: 'Begin settling', justrest: 'Begin resting' };

  // research-backed patterns; values are inhale, hold, exhale, rest in seconds
  const PATTERNS = {
    gentle:   [3, 0, 4, 0],
    coherent: [5.5, 0, 5.5, 0],
    longout6: [4, 0, 6, 0],
    longout5: [4, 0, 8, 0],
    sigh:     [3, 1, 6, 0],
    box:      [4, 4, 4, 4],
    '478':    [4, 7, 8, 0],
  };
  const KEYS = ['in', 'hi', 'out', 'ho'];
  const matchPattern = () => {
    const cur = KEYS.map(k => +sliders[k].value);
    const sel = $('pattern').value;
    if (MODES[sel]) return sel;
    const same = id => PATTERNS[id].every((v, i) => v === cur[i]);
    if (PATTERNS[sel] && same(sel)) return sel;
    return Object.keys(PATTERNS).find(same) || 'custom';
  };
  if (saved?.pattern) $('pattern').value = saved.pattern;
  $('pattern').value = matchPattern();
  const sighing = () => $('pattern').value === 'sigh';
  let curMode = mode();
  if (lens[curMode] != null) $('len').value = lens[curMode];

  // adaptive rhythm: before a session it shows where the last one started
  let idleR = store.get('breathfold-adapt-start', { in: 2.4, out: 3.6 });
  const curR = () => session?.ad ? session.ad.r : idleR;
  function adaptWords() {
    const ad = session?.ad;
    if (ad?.cue > 0) return ['smaller breaths', 'slowly out'];
    if (ad?.remind) return ['small, quiet breath in', 'and let it go'];
    return ['soft in', 'slowly out'];
  }

  const phases = () => mode() === 'adaptive' ? (() => {
    const r = curR(), w = adaptWords();
    return [{ key: 'in', word: w[0], d: r.in }, { key: 'out', word: w[1], d: r.out }];
  })() : [
    { key: 'in',  word: 'breathe in',  d: +sliders.in.value },
    { key: 'hi',  word: sighing() ? 'and a little more' : 'hold', d: +sliders.hi.value },
    { key: 'out', word: 'breathe out', d: +sliders.out.value },
    { key: 'ho',  word: 'rest',        d: +sliders.ho.value },
  ].filter(p => p.d > 0);

  const syncOutputs = () => {
    for (const k in sliders) outs[k].textContent = (+sliders[k].value) + 's';
    $('l-hi').textContent = sighing() ? 'Sip' : 'Hold';
  };

  function showRhythm() {
    const r = curR(), P = r.in + r.out;
    sliders.in.value = r.in; sliders.out.value = r.out;
    outs.in.textContent = r.in.toFixed(1) + 's'; outs.out.textContent = r.out.toFixed(1) + 's';
    $('autonote').textContent = session?.stage === 'tap' ? 'Finding your own pace…'
      : session?.ad ? `${(60 / P).toFixed(1)} breaths a minute · set by your heart rate`
      : 'Starts at your own pace, then follows your heart rate';
  }

  // ---- timing
  let running = true, phaseIdx = 0, phaseT = 0, last = performance.now();
  let breaths = 0, elapsed = 0, shownWord = '';
  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
  const fmt = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function unfoldAmount(ph, t) {
    // a cyclic sigh fills most of the way, then the second sip completes the star
    if (ph.key === 'in') return (sighing() ? 0.8 : 1) * ease(t);
    if (ph.key === 'hi') return sighing() ? 0.8 + 0.2 * ease(t) : 1;
    if (ph.key === 'out') return 1 - ease(t);
    return 0;
  }

  function setWord(w) {
    if (w === shownWord) return;
    shownWord = w;
    wordEl.classList.add('fading');
    setTimeout(() => { wordEl.textContent = w; wordEl.classList.remove('fading'); }, 450);
  }

  // ---- geometry: a chain of n equal hinged segments; every hinge turns by p * (360·k/n)°.
  // p = 0 is a straight line, p = 1 closes into the star polygon {n/k}.
  function chain(p) {
    const [n, k] = star;
    const turn = p * 2 * Math.PI * k / n;
    const a0 = -(n - 1) * turn / 2; // keep the middle segment level so the star closes point-up
    const pts = [[0, 0]];
    let x = 0, y = 0;
    for (let i = 0; i < n; i++) {
      const a = a0 + i * turn;
      x += Math.cos(a); y += Math.sin(a);
      pts.push([x, y]);
    }
    // centroid of the curve (segment midpoints), which is the star's centre when closed
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) { cx += (pts[i][0] + pts[i + 1][0]) / 2; cy += (pts[i][1] + pts[i + 1][1]) / 2; }
    cx /= n; cy /= n;
    let hx = 0, hy = 0;
    for (const q of pts) { q[0] -= cx; q[1] -= cy; hx = Math.max(hx, Math.abs(q[0])); hy = Math.max(hy, Math.abs(q[1])); }
    return { pts, hx, hy };
  }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---- nested polygons on a shared base: dot → line → triangle → square → … → octagon
  const POLY_MAX = 8, POLY_LINE = 0.12; // share of the breath spent growing the base line
  function drawPolygons(p, glowAmt, beat) {
    ctx.clearRect(0, 0, W, H);
    const R = Math.min(W, H) * (W < 560 ? 0.30 : 0.27);
    const L = R * 0.9;                                  // shared edge length
    const cx = W / 2, cy = H * (W < 560 ? 0.40 : 0.43);
    const by = cy + L / (2 * Math.tan(Math.PI / POLY_MAX)); // base so the final octagon is centred
    const x0 = cx - L / 2;
    const poly = n => {                                   // regular n-gon standing on the base, A then B then up
      const v = [[x0, by]];
      let x = x0, y = by;
      for (let j = 0; j < n - 1; j++) { const th = j * 2 * Math.PI / n; x += L * Math.cos(th); y -= L * Math.sin(th); v.push([x, y]); }
      return v;
    };
    const expand = k => {                                 // k-gon with one extra vertex at the top, to morph into the (k+1)-gon
      const u = poly(k);
      if (k % 2) { const m = (k + 1) / 2; u.splice(m, 0, [...u[m]]); }
      else { const a = u[k / 2], b = u[(k / 2 + 1) % k]; u.splice(k / 2 + 1, 0, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]); }
      return u;
    };
    const trace = (v, close = true) => { ctx.beginPath(); v.forEach(([X, Y], i) => i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y)); if (close) ctx.closePath(); };

    let outer, done = 0, isLine = false;
    if (p < POLY_LINE) {
      const half = (L / 2) * ease(p / POLY_LINE);
      outer = [[cx - half, by], [cx + half, by]]; isLine = true;
    } else {
      const s = 2 + (p - POLY_LINE) / (1 - POLY_LINE) * (POLY_MAX - 2);
      const k = Math.min(POLY_MAX - 1, Math.floor(s)), t = s - k;
      const a = expand(k), b = poly(k + 1);
      outer = a.map((q, i) => [q[0] + (b[i][0] - q[0]) * t, q[1] + (b[i][1] - q[1]) * t]);
      done = k;
    }
    const mx = outer.reduce((m, q) => m + q[0], 0) / outer.length;
    const my = outer.reduce((m, q) => m + q[1], 0) / outer.length;

    const halo = ctx.createRadialGradient(mx, my, 0, mx, my, R * (0.6 + 0.9 * p + 0.05 * beat));
    halo.addColorStop(0, `rgba(159,212,196,${0.05 + 0.07 * p + 0.025 * beat})`);
    halo.addColorStop(1, 'rgba(159,212,196,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    trace(poly(POLY_MAX));                                // ghost of the destination
    ctx.strokeStyle = 'rgba(228,236,230,0.045)'; ctx.lineWidth = 1; ctx.stroke();

    if (!isLine) { trace(outer); ctx.fillStyle = `rgba(159,212,196,${0.03 + 0.05 * p})`; ctx.fill(); }

    for (let n = 3; n <= done; n++) {                     // the polygons already passed stay as fine lines
      trace(poly(n));
      ctx.strokeStyle = `rgba(228,236,230,${0.3 + 0.15 * (n / POLY_MAX)})`; ctx.lineWidth = 1; ctx.stroke();
    }

    trace(outer, !isLine);
    ctx.save();
    ctx.shadowColor = GLOW; ctx.shadowBlur = 18 + 22 * glowAmt;
    ctx.strokeStyle = `rgba(159,212,196,${0.25 + 0.25 * glowAmt})`; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    trace(outer, !isLine);
    ctx.strokeStyle = MOON; ctx.globalAlpha = 0.55 + 0.4 * p; ctx.lineWidth = 1.4; ctx.stroke();

    ctx.fillStyle = MOON;                                 // the two base corners, like the star's end hinges
    for (const q of [outer[0], outer[1]]) {
      ctx.globalAlpha = Math.min(1, 0.35 + 0.5 * p + 0.2 * beat);
      ctx.beginPath(); ctx.arc(q[0], q[1], 2.2 + 0.6 * beat, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(p, glowAmt, beat) {
    if ($('shape').value === 'poly') return drawPolygons(p, glowAmt, beat);
    ctx.clearRect(0, 0, W, H);
    const [n, k] = star;
    const cx = W / 2, cy = H * (W < 560 ? 0.40 : 0.43);
    const R = Math.min(W, H) * (W < 560 ? 0.30 : 0.27);
    const finalScale = R * 2 * Math.sin(Math.PI * k / n); // chord length for circumradius R
    const { pts, hx, hy } = chain(p);
    const s = Math.min(finalScale, (W * 0.42) / Math.max(hx, 1e-6), (H * 0.36) / Math.max(hy, 1e-6));

    // halo that swells with the breath, with a faint thump on each heartbeat
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * (0.6 + 0.9 * p + 0.05 * beat));
    halo.addColorStop(0, `rgba(159,212,196,${0.05 + 0.07 * p + 0.025 * beat})`);
    halo.addColorStop(1, 'rgba(159,212,196,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    // ghost of the destination star
    const ghost = chain(1).pts;
    ctx.beginPath();
    ghost.forEach((q, i) => { const X = cx + q[0] * finalScale, Y = cy + q[1] * finalScale; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.strokeStyle = 'rgba(228,236,230,0.045)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const path = () => {
      ctx.beginPath();
      pts.forEach((q, i) => { const X = cx + q[0] * s, Y = cy + q[1] * s; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });

    path();
    ctx.save();
    ctx.shadowColor = GLOW;
    ctx.shadowBlur = 18 + 22 * glowAmt;
    ctx.strokeStyle = `rgba(159,212,196,${0.25 + 0.25 * glowAmt})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    // crisp line
    path();
    ctx.strokeStyle = MOON;
    ctx.globalAlpha = 0.55 + 0.4 * p;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // hinges
    ctx.fillStyle = MOON;
    pts.forEach((q, i) => {
      const r = ((i === 0 || i === pts.length - 1) ? 2.4 : 1.6) + 0.6 * beat;
      ctx.globalAlpha = Math.min(1, 0.35 + 0.5 * p + 0.2 * beat);
      ctx.beginPath(); ctx.arc(cx + q[0] * s, cy + q[1] * s, r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ---- heart rate over the standard Bluetooth Heart Rate Profile (service 0x180D)
  const hr = { device: null, connected: false, bpm: null, hasRR: false, beatPhase: 0, lastData: 0, packets: 0, rrPackets: 0, raw: '' };

  function parseHeartRate(dv) {
    const flags = dv.getUint8(0);
    let i = 1;
    const bpm = flags & 0x01 ? dv.getUint16(i, true) : dv.getUint8(i);
    i += flags & 0x01 ? 2 : 1;
    if (flags & 0x08) i += 2;                 // energy expended
    const rr = [];
    if (flags & 0x10) for (; i + 1 < dv.byteLength; i += 2) rr.push(dv.getUint16(i, true) * 1000 / 1024); // 1/1024 s -> ms
    return { bpm, rr };
  }

  function onHeartRate(e) {
    const { bpm, rr } = parseHeartRate(e.target.value);
    hr.lastData = performance.now();
    // packet stats, so the status line can show what the sensor actually sends
    const dv = e.target.value;
    hr.packets++; if (rr.length) hr.rrPackets++;
    hr.raw = Array.from({ length: dv.byteLength }, (_, j) => dv.getUint8(j).toString(16).padStart(2, '0')).join(' ');
    if (bpm > 0) hr.bpm = bpm;
    if (rr.length) hr.hasRR = true;
    $('bpm').textContent = hr.bpm ?? '--';
    if (session) {
      if (bpm > 0) session.samples.push([session.clock, bpm]);
      const bucket = session[session.stage];
      if (bucket) { if (bpm > 0) bucket.bpm.push(bpm); bucket.rr.push(...rr); }
    }
    updateHrStatus();
  }

  function updateHrStatus(msg) {
    const el = $('hrstatus');
    if (msg) { el.textContent = msg; return; }
    if (!hr.connected) { el.textContent = hr.device ? 'Disconnected' : mode() === 'pattern' ? 'Fitbit Air, chest strap or watch' : 'Connect heart rate to begin'; return; }
    const name = hr.device?.name || 'Sensor';
    el.textContent = hr.bpm == null ? `${name} · waiting for data`
      : hr.hasRR ? `${name} · beat intervals ✓ (${hr.rrPackets}/${hr.packets} packets)`
      : `${name} · heart rate only · breath swing will be measured`;
    el.title = hr.raw ? `Last packet: ${hr.raw}` : '';
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let attaching = false, manualDisconnect = false;

  // a band that's busy with another phone or tablet may never answer; don't wait on it forever
  const timeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what)), ms))]);

  async function attachOnce() {
    const server = await timeout(hr.device.gatt.connect(), 12000, 'no answer from the band');
    await sleep(300); // some bands drop the link if asked for services immediately
    if (!server.connected) throw new Error('link dropped');
    const svc = await timeout(server.getPrimaryService('heart_rate'), 8000, 'no heart rate service');
    const ch = await svc.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', onHeartRate);
    await ch.startNotifications();
  }

  // Bluetooth links often drop during setup; retry a few times before giving up.
  async function attach(tries = 3) {
    attaching = true;
    try {
      for (let n = 1; ; n++) {
        try {
          await attachOnce();
          break;
        } catch (err) {
          try { hr.device.gatt.disconnect(); } catch (e) {}
          if (n >= tries) throw err;
          updateHrStatus(`Connecting… (attempt ${n + 1} of ${tries})`);
          await sleep(600 * n);
        }
      }
    } finally {
      attaching = false;
    }
    hr.connected = true;
    $('connect').textContent = 'Disconnect';
    $('connect').classList.add('on');
    $('pulse').hidden = false;
    updateHrStatus();
    refreshMode();
  }

  const connectError = err =>
    `Could not connect (${err.message}). Is the band still connected to another phone, tablet or app? Close Breathfold there, check that Share heart rate is on in Google Health, then press Connect again.`;

  async function connect() {
    if (hr.connected) { manualDisconnect = true; hr.device.gatt.disconnect(); return; }
    if (attaching) return;                 // already trying; the attempt will finish or time out by itself
    try {
      if (!hr.device) {
        updateHrStatus('Pick your device in the browser list…');
        hr.device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
        hr.device.addEventListener('gattserverdisconnected', onDisconnect);
      }
      updateHrStatus('Connecting…');
      await attach();
    } catch (err) {
      hr.connected = false;
      if (err.name === 'NotFoundError') { updateHrStatus('No device chosen'); return; }
      updateHrStatus(connectError(err));
      $('connect').textContent = 'Connect heart rate';
    }
  }

  async function onDisconnect() {
    if (attaching) return; // attach() is already retrying
    hr.connected = false;
    $('connect').textContent = 'Connect heart rate';
    $('connect').classList.remove('on');
    $('pulse').hidden = true;
    refreshMode();
    if (manualDisconnect) { manualDisconnect = false; hr.device = null; updateHrStatus(); return; }
    // the band dropped out: reconnect quietly to the same device, no picker needed
    try { updateHrStatus('Signal lost, reconnecting…'); await attach(); }
    catch (err) { updateHrStatus(connectError(err)); }
  }

  if (!navigator.bluetooth) {
    $('connect').disabled = true;
    updateHrStatus('Heart rate needs Chrome or Edge on Android, Windows or Mac');
  }
  $('connect').addEventListener('click', connect);

  // ---- HRV: RMSSD over cleaned beat-to-beat intervals
  function rmssd(rrAll) {
    const rr = rrAll.filter(x => x >= 300 && x <= 2000);
    if (rr.length < 20) return null;
    const med = [...rr].sort((a, b) => a - b)[rr.length >> 1];
    let sum = 0, pairs = 0, kept = 0, prev = null;
    for (const x of rr) {
      if (Math.abs(x - med) / med > 0.3) { prev = null; continue; }   // ectopic beat or dropout
      kept++;
      if (prev != null && Math.abs(x - prev) / prev <= 0.2) { sum += (x - prev) ** 2; pairs++; }
      prev = x;
    }
    return pairs >= 15 ? { value: Math.sqrt(sum / pairs), beats: kept } : null;
  }
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

  // ---- sessions: [measure before] -> breathe -> [measure after] -> results
  let session = null, demoP = 0;
  // the rest checks deliberately don't mention breathing, so it's left alone
  const STAGE_WORDS = { before: 'rest, and just watch', after: 'rest again, and just watch', settle: 'settle in, and just watch',
    rest: 'rest, and just watch', tap: 'breathe as you are, and tap as each breath comes in' };
  const STAGE_LABELS = { before: 'before', after: 'after', settle: 'settling in', rest: 'resting', tap: 'your own pace' };
  let demoHist = null;

  // ---- rest scene: a slow night flight over an endless mountain range.
  // The fractal mountains are computed once into a seamless, repeating height map; each frame only looks it up,
  // which is far cheaper than recomputing the fractal per pixel and keeps the ridges steady (no sparkle).
  // Steady glide, no pulsing or rhythm near breathing rates, so it doesn't pace the breath.
  const restScene = (() => {
    const el = $('rest');
    const gl = el.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });
    if (!gl) return null;
    const TILE = 48, N = 2048;            // world units per tile, texels per side

    // Baked in a background worker (with its mip chain), so the breathing animation never stalls.
    function bake(N) {

        let sum = 0, amp = 0.55, w = 1;
        for (let k = 0; k < OCT; k++) {

          const fx = (x + 0.5) / N * P + k * 0.37, fy = (y + 0.5) / N * P + k * 0.61;
          const ix = Math.floor(fx), iy = Math.floor(fy);
          let ux = fx - ix, uy = fy - iy; ux = ux * ux * (3 - 2 * ux); uy = uy * uy * (3 - 2 * uy);
          const x0 = ix % P, x1 = (x0 + 1) % P, y0 = iy % P, y1 = (y0 + 1) % P;
          const v = (a[y0 * P + x0] * (1 - ux) + a[y0 * P + x1] * ux) * (1 - uy) + (a[y1 * P + x0] * (1 - ux) + a[y1 * P + x1] * ux) * uy;
          let n = 1 - Math.abs(v * 2 - 1); n *= n;
          sum += amp * n * w; w = Math.min(1, n * 1.4); amp *= 0.5;

      for (let size = N, cur = h; size > 1; size >>= 1) {

    function startBake() {

        const src = `const bake = ${bake.toString()};
onmessage = e => { const lv = bake(e.data); postMessage(lv, lv.map(a => a.buffer)); };`;
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        w.onmessage = e => { upload(e.data); w.terminate(); };
        w.onerror = () => { w.terminate(); upload(bake(N)); };

    }

    const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
    const FS = `#version 300 es
precision highp float;
uniform sampler2D Hm; uniform vec2 R; uniform float T; uniform vec2 S;
out vec4 o;
const float TILE = ${TILE.toFixed(1)}, TEX = ${N.toFixed(1)};
float hash(vec2 p){ p = mod(p, 289.); p = fract(p * vec2(0.1031, 0.1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
float H(vec2 p, float lod){ return textureLod(Hm, p / TILE, lod).r; }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * R) / R.y;
  float px = 1. / R.y;                                                  // view angle of one pixel
  float z = T * 0.36;
  const float A = 0.41;                                                 // fly at a slant across the tile, so the repeat never lines up
  vec2 dir = vec2(sin(A), cos(A)), side = vec2(dir.y, -dir.x);
  vec2 pos = S + dir * z + side * 1.4 * sin(z * 0.045);
  vec3 ro = vec3(pos.x, 2.0, pos.y);
  float hd = A + 0.25 * sin(z * 0.03);
  vec3 fw = normalize(vec3(sin(hd), -0.09, cos(hd)));
  vec3 rt = normalize(cross(vec3(0,1,0), fw)), up = cross(fw, rt);
  vec3 rd = normalize(fw + uv.x * rt + uv.y * up);

  vec3 night = vec3(0.039, 0.086, 0.098), haze = vec3(0.12, 0.22, 0.24), glow = vec3(0.62, 0.83, 0.77), moon = vec3(0.89, 0.93, 0.90);
  vec3 L = normalize(vec3(-0.6, 0.35, 0.7));
  float hor = clamp(1. - rd.y * 3.2, 0., 1.);
  vec3 sky = mix(night, haze, hor * hor);
  sky += glow * 0.22 * pow(max(dot(rd, L), 0.), 12.);                // the moon's glow behind the haze
  vec2 sg = floor(rd.xz / max(rd.y, 0.05) * 90.);
  sky += moon * step(0.996, hash(sg)) * smoothstep(0.08, 0.35, rd.y) * 0.35;  // a few still stars

  // aurora: curtains traced through stacked sky layers, slowly morphing (noise in time, never repeating)
  vec3 aur = vec3(0.);
  if (rd.y > 0.02) {
    vec2 q0 = (ro.xz + rd.xz * (5. - ro.y) / rd.y) * 0.07;
    vec2 warp = vec2(noise(q0 * 0.6 + T * 0.006), noise(q0 * 0.6 - T * 0.005 + 7.)) * 1.8;
    float jit = fract(52.98 * fract(dot(gl_FragCoord.xy, vec2(0.0671, 0.00584))));
    for (int i = 0; i < 12; i++) {
      float fi = float(i);
      float d = (5. + (fi + jit) * 0.34 - ro.y) / rd.y;
      vec2 q = (ro.xz + rd.xz * d) * 0.07 + warp;
      float c = 1. - abs(noise(vec2(q.x * 1.6, q.y * 0.45) + vec2(T * 0.008, 0.)) * 2. - 1.);
      c = pow(c, 7.);
      aur += mix(vec3(0.30, 0.95, 0.72), vec3(0.50, 0.50, 0.95), fi / 11.) * c * (1. - fi / 12.) * 0.115;
    }
    aur *= smoothstep(0.05, 0.22, rd.y) * (0.55 + 0.45 * noise(vec2(T * 0.01, 3.)));
  }
  sky += aur;

  // march the stored height map; detail level follows the pixel's footprint, so distant ridges don't shimmer
  float t = 0.1, tp = 0.1, hit = 0.;
  float lodK = log2(TEX / TILE * px);
  for (int i = 0; i < 128; i++) {
    vec3 p = ro + rd * t;
    float d = p.y - H(p.xz, max(0., lodK + log2(t)));
    if (d < 0.0012 * t) { hit = 1.; break; }
    tp = t; t += d * (0.5 + 0.01 * t); if (t > 34.) break;
  }
  if (hit < 1. && t < 34.) hit = 1.;                                    // a ray skimming a ridge still counts as a hit
  vec3 col = sky;
  if (hit > 0.) {
    for (int i = 0; i < 5; i++) { float tm = 0.5 * (tp + t); vec3 q = ro + rd * tm; if (q.y - H(q.xz, max(0., lodK + log2(tm))) < 0.) t = tm; else tp = tm; }
    vec3 p = ro + rd * t;
    float lod = max(0., lodK + log2(t));
    float e = max(TILE / TEX, t * px * 1.5);
    float h = H(p.xz, lod);
    vec3 n = normalize(vec3(H(p.xz - vec2(e,0), lod) - H(p.xz + vec2(e,0), lod), 2. * e, H(p.xz - vec2(0,e), lod) - H(p.xz + vec2(0,e), lod)));
    float dif = max(dot(n, L), 0.);
    col = vec3(0.05, 0.11, 0.12) * (0.35 + 0.65 * n.y) + glow * 0.42 * dif;
    col = mix(col, moon * 0.75, smoothstep(0.4, 0.95, n.y) * smoothstep(0.9, 1.5, h) * 0.6);  // pale light on the high slopes
    float drift = noise(p.xz * 0.22 + vec2(T * 0.035, T * 0.021));      // mist patches drifting through the valleys
    col = mix(col, haze * 1.3, (1. - smoothstep(-0.1, 0.6, h)) * (0.25 + 0.5 * drift));
    col = mix(col, sky, 1. - exp(-t * 0.1));                            // distance haze
  }
  col *= 1. - 0.35 * dot(uv, uv);                                       // soft vignette
  o = vec4(pow(col, vec3(0.95)), 1.);
}`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    let prog;
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (e) { console.warn('rest scene unavailable', e); return null; }
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    const uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T'), uS = gl.getUniformLocation(prog, 'S');
    gl.uniform1i(gl.getUniformLocation(prog, 'Hm'), 0);

    // bake the mountains while the app is idle, well before the first rest check
    setTimeout(startBake, 800);

    let on = false, lastDraw = 0, seed = [0, 0], t0 = 0;
    // sharp by default; only if frames keep arriving late does it draw fewer pixels, and never changes mid-glide more than needed
    let scale = 0, gap = 33, draws = 0;
    const maxScale = () => Math.min(1, 1600 / Math.max(innerWidth, innerHeight));
    return {
      show(v, now) {
        if (v && !on) {
          startBake();
          seed = [Math.random() * TILE, Math.random() * TILE]; t0 = now; lastDraw = 0; draws = 0; gap = 33;
          if (scale) scale = Math.min(maxScale(), scale * 1.15);      // try a little sharper again each time
        }
        on = v; el.classList.toggle('on', v); document.body.classList.toggle('resting', v);
      },
      render(now) {
        if (!on || !tex || now - lastDraw < 29) return;    // ~30 fps is plenty for a slow glide; the slack keeps the pacing even
        if (lastDraw) gap = gap * 0.9 + Math.min(200, now - lastDraw) * 0.1;
        lastDraw = now;
        if (!scale) scale = Math.min(0.85, maxScale());
        if (++draws % 30 === 0 && gap > 42) scale = Math.max(0.5, scale * 0.85);   // step down only when it's clearly struggling
        const w = Math.max(1, Math.round(innerWidth * scale)), h = Math.max(1, Math.round(innerHeight * scale));

        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.uniform2f(uR, w, h); gl.uniform1f(uT, (now - t0) / 1000 + 4); gl.uniform2f(uS, seed[0], seed[1]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      },
    };
  })();

  const newSession = (kind, stages, fast) => ({
    kind, stages, fast, idx: 0, stageT: 0, clock: 0, startedAt: new Date(), breaths0: breaths,
    samples: [], marks: {}, swings: [], cycleStart: null, pace: [], rates: [], taps: [],
    before: { bpm: [], rr: [] }, after: { bpm: [], rr: [] }, breathe: { bpm: [], rr: [] }, tap: { bpm: [], rr: [] }, rest: { bpm: [], rr: [] },
    measured: false, pattern: phases().map(p => [p.key, p.d]),
  });

  function beginSession() {
    const fast = new URLSearchParams(location.search).has('fast') ? 0.1 : 1; // test hook: ?demo&fast runs a session 10× quicker
    const m = mode(), len = +$('len').value * fast;
    const stages = [];
    if (m === 'adaptive') {
      if (!hr.connected) return;
      stages.push({ key: 'tap', dur: 90 * fast }, { key: 'breathe', dur: len });
    } else if (m === 'justrest') {
      if (!hr.connected) return;
      stages.push({ key: 'rest', dur: len });
    } else {
      const measure = hr.connected ? +$('measure').value * fast : 0;
      if (measure) stages.push({ key: 'before', dur: measure });
      else if (+$('measure').value) stages.push({ key: 'settle', dur: 60 * fast }); // no sensor: a quiet minute to settle in
      stages.push({ key: 'breathe', dur: len });
      if (measure) stages.push({ key: 'after', dur: measure });
    }
    session = newSession(m, stages, fast);
    session.measured = stages.some(st => st.key === 'before');
    enterStage();
    running = true; $('play').textContent = 'Pause';
    $('session').textContent = 'End session';
    refreshMode();
  }

  function enterStage() {
    const st = session.stages[session.idx];
    session.stage = st.key; session.stageT = 0;
    session.marks[st.key] = [session.clock, null];
    if (st.key === 'breathe') {
      phaseIdx = 0; phaseT = 0; session.cycleStart = session.clock;
      if (session.kind === 'adaptive') startAdaptive();
    }
    refreshMode();
  }

  // ---- Settle heart rate: start at the user's own pace, then slow gently while heart rate holds steady or falls.
  // Extra time goes to the out-breath first (a longer in-breath invites a bigger breath); never slower than
  // 6 breaths a minute, never more than twice as long out as in, no holds.
  const ADAPT = { warm: 60, block: 6, step: 1.04, floorP: 10, rise: 3, steady: 1 };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const meanIn = (s, a, b) => mean(s.samples.filter(p => p[0] >= a && p[0] < b).map(p => p[1]));

  // how long the band's heart rate trails the breath; learned per device from earlier sessions
  const lagKey = () => hr.device?.name || 'sensor';
  const bandLag = () => clamp(store.get('breathfold-lag', {})[lagKey()]?.lag ?? 4, 2, 8);

  function slower(r) {
    const P = r.in + r.out, P2 = Math.min(ADAPT.floorP, P * ADAPT.step);
    if (P2 - P < 0.02) return null;               // at the floor
    let i = r.in, o = r.out + (P2 - P);
    if (o > 2 * i) { i = Math.max(r.in, P2 / 3); o = P2 - i; }
    return { in: i, out: o };
  }
  const faster = r => r.in + r.out <= 2.6 ? null : { in: r.in / ADAPT.step, out: r.out / ADAPT.step };

  function startAdaptive() {
    const s = session, iv = [];
    for (let i = 1; i < s.taps.length; i++) iv.push(s.taps[i] - s.taps[i - 1]);
    const good = iv.filter(x => x >= 1.5 && x <= 20);
    const P = clamp(good.length >= 2 ? median(good) : 5, 2.5, ADAPT.floorP);
    const r = { in: P * 0.42, out: P * 0.58 };
    s.ad = { r, start: { ...r }, own: good.length >= 2, hist: [], pending: null, blockStart: null, blockBreaths: 0, refWin: null,
      decide: null, cooldown: 0, cue: 0, cueUsed: false, remind: false, lastRemind: s.clock, eased: 0, slowed: 0, log: [], lag: bandLag() };
    s.rates.push([s.clock, 60 / P]);
    idleR = { ...r }; store.set('breathfold-adapt-start', idleR);
  }

  function easeBack(byUser) {
    const ad = session.ad;
    if (ad.pending) { ad.pending = null; ad.hist.pop(); ad.slowed--; }   // cancel a slow-down that hasn't started yet
    const back = ad.hist.pop() || faster(ad.r);
    if (back) ad.pending = back;
    ad.cooldown = 2; ad.eased++;
    if (byUser) ad.log.push({ t: session.clock, action: 'easier (you)' });
  }

  // median breath swing over the breaths in a window, each breath's window shifted by the band's lag
  function blockSwing(s, a, b, lag) {
    const v = s.swings.filter(c => c.t0 >= a - 0.01 && c.t1 <= b + 0.01).map(c => swingFor(s.samples, c.t0 + lag, c.t1 + lag)).filter(x => x != null);
    return v.length >= 3 ? median(v) : null;
  }

  function decide() {
    const s = session, ad = s.ad, { t0, t1, ref } = ad.decide, L = ad.lag;
    ad.decide = null;
    const hb = meanIn(s, t0 + L, t1 + L), h0 = meanIn(s, ref[0] + L, ref[1] + L);
    if (hb == null || h0 == null) return;
    const d = hb - h0, sb = blockSwing(s, t0, t1, L), sr = blockSwing(s, ref[0], ref[1], L);
    let action;
    if (d >= ADAPT.rise) {
      // heart rate rose: if the swing jumped too, the breaths have probably got deeper; ask for smaller ones first
      if (!ad.cueUsed && sb != null && sr != null && sb >= 3 && sb >= 1.5 * sr) { ad.cue = 6; ad.cueUsed = true; action = 'smaller breaths'; }
      else { easeBack(); action = 'eased'; }
    } else {
      ad.cueUsed = false;
      if (ad.cooldown > 0) { ad.cooldown--; action = 'hold'; }
      else if (d <= ADAPT.steady) {
        const n = slower(ad.r);
        if (n) { ad.hist.push(ad.r); ad.pending = n; ad.slowed++; action = 'slower'; } else action = 'floor';
      } else action = 'hold';
    }
    ad.log.push({ t: t1, d: +d.toFixed(1), sb, sr, action });
  }

  // called at the start of every breath while settling
  function onCycle() {
    const s = session, ad = s.ad;
    if (ad.pending) {
      ad.r = ad.pending; ad.pending = null;
      s.rates.push([s.clock, 60 / (ad.r.in + ad.r.out)]);
      if (ad.blockStart != null) { ad.blockStart = s.clock; ad.blockBreaths = 0; }
      showRhythm();
    }
    if (ad.cue > 0) ad.cue--;
    ad.remind = !ad.cue && s.clock - ad.lastRemind >= 180 * s.fast;
    if (ad.remind) ad.lastRemind = s.clock;
    if (ad.blockStart == null) {                  // the first minute only settles in; syncing up often lifts heart rate briefly
      if (s.clock - s.marks.breathe[0] >= ADAPT.warm * s.fast) { ad.blockStart = s.clock; ad.blockBreaths = 0; ad.refWin = [s.clock - 30 * s.fast, s.clock]; }
      return;
    }
    if (++ad.blockBreaths >= ADAPT.block) {
      ad.decide = { t0: ad.blockStart, t1: s.clock, ref: ad.refWin };   // judged once the band has caught up
      ad.refWin = [ad.blockStart, s.clock];
      ad.blockStart = s.clock; ad.blockBreaths = 0;
    }
  }

  function adaptTick() {
    const s = session, ad = s.ad;
    if (ad.decide && s.clock >= ad.decide.t1 + ad.lag) decide();
    // "until I stop": finish once heart rate has levelled off for two minutes
    if (+$('len').value === 0 && s.clock - (ad.plateauT || 0) > 10) {
      ad.plateauT = s.clock;
      if (s.clock - s.marks.breathe[0] >= 360 * s.fast) {
        const m = [0, 1, 2, 3].map(i => meanIn(s, s.clock - 30 * s.fast * (i + 1), s.clock - 30 * s.fast * i));
        if (m.every(x => x != null) && Math.max(...m) - Math.min(...m) <= 2) nextStage();
      }
    }
  }

  function tapBreath() {
    const s = session;
    s.taps.push(s.clock);
    countEl.animate?.([{ opacity: 1, color: '#9fd4c4' }, { opacity: 0.6 }], { duration: 700 });
    if (s.taps.length >= 7) nextStage();
  }

  // ---- breath swing: how far heart rate rises and falls within each breath (works with bpm-only bands)
  // A full breath window always contains one peak and one trough, so the band's lag doesn't matter here.
  function swingFor(samples, t0, t1) {
    const v = samples.filter(p => p[0] >= t0 && p[0] < t1).map(p => p[1]);
    return v.length >= 4 ? Math.max(...v) - Math.min(...v) : null;
  }
  const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

  function closeCycle() {
    const t0 = session.cycleStart, t1 = session.clock;
    session.cycleStart = t1;
    const sw = swingFor(session.samples, t0, t1);
    if (sw == null) return;
    session.swings.push({ t0, t1, swing: sw });
    $('swing').textContent = ` · swing ${sw}`;
  }

  // How long heart rate trails the breath: the shift that best lines up heart rate (around its own running mean)
  // with the pacer. It includes the body's own response and the band's smoothing delay.
  function estimateLag(s) {
    const pace = s.pace;
    if (pace.length < 150 || s.swings.length < 12) return null;
    const per = median(s.swings.map(c => c.t1 - c.t0));
    const pts = s.samples.filter(p => p[0] >= pace[0][0] + per && p[0] <= pace[pace.length - 1][0]);
    if (pts.length < 40) return null;
    const res = pts.map(([t, v]) => [t, v - mean(pts.filter(q => Math.abs(q[0] - t) <= per / 2).map(q => q[1]))]);
    const pAt = t => {
      let lo = 0, hi = pace.length - 1;
      if (t <= pace[0][0]) return pace[0][1];
      if (t >= pace[hi][0]) return pace[hi][1];
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pace[m][0] <= t) lo = m; else hi = m; }
      const [ta, a] = pace[lo], [tb, b] = pace[hi];
      return a + (b - a) * (t - ta) / Math.max(1e-6, tb - ta);
    };
    const corr = (x, y) => {
      const mx = mean(x), my = mean(y); let sxy = 0, sxx = 0, syy = 0;
      for (let i = 0; i < x.length; i++) { const a = x[i] - mx, b = y[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }
      return sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
    };
    const x = res.map(r => r[1]);
    let best = null;
    for (let L = 0; L <= Math.min(10, per * 0.9); L += 0.5) {
      const r = corr(x, res.map(q => pAt(q[0] - L)));
      if (!best || r > best.r) best = { lag: L, r };
    }
    return best && best.r >= 0.2 ? best : null;
  }

  function recordLag(lg) {
    const all = store.get('breathfold-lag', {}), k = lagKey(), prev = all[k];
    all[k] = prev ? { lag: +(prev.lag * 0.7 + lg.lag * 0.3).toFixed(2), n: prev.n + 1 } : { lag: lg.lag, n: 1 };
    store.set('breathfold-lag', all);
    return all[k];
  }

  function nextStage() {
    session.marks[session.stage][1] = session.clock;
    if (session.stage === 'breathe') session.breaths = breaths - session.breaths0;
    session.idx++;
    if (session.idx >= session.stages.length) finishSession();
    else enterStage();
  }

  function endSessionEarly() {
    if (!session) return;
    if (session.stage === 'before' || session.stage === 'tap') { session = null; $('session').textContent = BEGIN[mode()]; refreshMode(); return; }
    nextStage();
  }

  function finishSession() {
    const s = session; session = null;
    running = false; $('play').textContent = 'Resume';
    $('session').textContent = BEGIN[mode()];
    if (s.breaths == null) s.breaths = breaths - s.breaths0;
    $('swing').textContent = '';
    s.lagEst = estimateLag(s);
    if (s.lagEst) s.lagAvg = recordLag(s.lagEst);
    refreshMode();
    showResults(s);
  }

  // what the panel shows depends on the mode; called whenever the mode, session or connection changes
  function refreshMode() {
    const m = mode(), auto = m === 'adaptive', rest = m === 'justrest';
    $('sliders').hidden = rest;
    $('sliders').classList.toggle('auto', auto);
    for (const k of KEYS) sliders[k].disabled = auto;
    $('f-hi').hidden = $('f-ho').hidden = auto;
    $('autonote').hidden = !auto;
    $('shape').hidden = rest;
    $('measure').hidden = auto || rest;
    if (!session) $('session').textContent = BEGIN[m];
    $('session').disabled = !session && (auto || rest) && !hr.connected;
    $('easy').hidden = !(session?.kind === 'adaptive' && session.stage === 'breathe');
    // a guided session can't switch mode midway; a pattern session can still change pattern
    $('pattern').disabled = !!session && session.kind !== 'pattern';
    for (const v in MODES) $('pattern').querySelector(`option[value="${v}"]`).disabled = !!session;
    if (auto) showRhythm(); else syncOutputs();
  }

  // ---- results for Settle heart rate and Just rest
  function guidedStats(s) {
    if (s.samples.length < 10) return null;
    const f = s.fast || 1, W = 30 * f;
    const start = meanIn(s, 0, W), end = meanIn(s, s.clock - 60 * f, s.clock + 1);
    let low = null, t10 = null;
    for (const [t] of s.samples) {
      if (t < W) continue;
      const m = meanIn(s, t - W, t + 0.001);
      if (low == null || m < low) low = m;
      if (t10 == null && start != null && m <= start - 10) t10 = t;
    }
    // drop over the first five minutes, the same yardstick for both kinds of session
    const at5 = s.clock >= 330 * f ? meanIn(s, 270 * f, 330 * f) : null;
    return { start, end, low, t10, d5: start != null && at5 != null ? start - at5 : null };
  }

  function lagNote(s) {
    if (!s.lagEst) return '';
    const avg = s.lagAvg?.n > 1 ? ` On average for ${lagKey()}: ${s.lagAvg.lag.toFixed(1)} s over ${s.lagAvg.n} sessions.` : '';
    return ` Your heart rate peaked about ${s.lagEst.lag.toFixed(1)} s after each in-breath ended; part of that is the band's own delay, and Settle heart rate allows for it.${avg}`;
  }

  function showGuidedResults(s) {
    const st = guidedStats(s), ad = s.ad, f = s.fast || 1;
    const adaptive = s.kind === 'adaptive';
    $('r-when').textContent = s.startedAt.toLocaleString([], { weekday: 'long', hour: '2-digit', minute: '2-digit' })
      + ` · ${fmt(s.clock / f)} · ${adaptive ? 'settle heart rate' : 'just rest'}`;
    $('r-title').textContent = adaptive ? 'Settling heart rate' : 'Just rest';

    const cell = (v, unit, dp = 0) => v == null ? '<span class="v">—</span>' : `<span class="v">${v.toFixed(dp)}<small>${unit}</small></span>`;
    const r0 = s.rates[0]?.[1], r1 = s.rates[s.rates.length - 1]?.[1];
    $('r-compare').innerHTML = st ? `
      <span></span><span class="h">Start</span><span class="h">End</span>
      <span class="k">Heart rate</span>${cell(st.start, 'bpm')}${cell(st.end, 'bpm')}
      ${adaptive && r0 ? `<span class="k">Breathing</span>${cell(r0, '/min', 1)}${cell(r1, '/min', 1)}` : ''}` : '';
    $('r-compare').hidden = !st;

    const lines = [];
    if (st) {
      if (st.t10 != null) lines.push(`Down 10 bpm after <span class="up">${fmt(st.t10 / f)}</span>`);
      else if (st.low != null && st.start != null) lines.push(`Lowest ${Math.round(st.low)} bpm, ${Math.max(0, st.start - st.low).toFixed(0)} below the start`);
      if (st.d5 != null) lines.push(`First 5 minutes <span class="${st.d5 >= 0 ? 'up' : 'down'}">${st.d5 >= 0 ? '−' : '+'}${Math.abs(st.d5).toFixed(1)} bpm</span>`);
    }
    if (adaptive && ad) {
      const bits = [`slowed ${ad.slowed} time${ad.slowed === 1 ? '' : 's'}`];
      if (ad.eased) bits.push(`eased back ${ad.eased}`);
      const cues = ad.log.filter(l => l.action === 'smaller breaths').length;
      if (cues) bits.push(`asked for smaller breaths ${cues}×`);
      lines.push(`Pace ${bits.join(', ')}`);
    }
    // settle against just rest, once there are a few of each
    const hist = store.get('unfolding-star-history', []);
    const all = st?.d5 != null ? [{ k: s.kind, d5: st.d5 }, ...hist] : hist;
    const by = k => all.filter(h => h.k === k && h.d5 != null).map(h => h.d5);
    const a = by('adaptive'), b = by('justrest');
    if (a.length >= 2 && b.length >= 2) {
      lines.push(`Typical first-5-minute drop: settling −${median(a).toFixed(1)} bpm (${a.length}) · just rest −${median(b).toFixed(1)} bpm (${b.length})`);
    }
    $('r-delta').innerHTML = lines.join('<br>');
    $('r-delta').hidden = !lines.length;

    let note = adaptive
      ? (ad?.own ? 'The pace started at your own rhythm' : 'The pace started at a gentle 12 breaths a minute') +
        ' and slowed only while your heart rate held steady or fell, easing back when it rose. Heart rate falls after activity anyway, so now and then do a Just rest session after similar activity; once there are a few of each, this card compares the two.'
      : 'No pacer, just rest. These sessions are the yardstick for Settle heart rate: after similar activity, does pacing bring your heart rate down faster than resting alone?';
    if (st && st.d5 == null) note += ' Sessions of 6 minutes or more also count toward the five-minute comparison.';
    $('r-note').textContent = note + lagNote(s);
    $('r-chart').innerHTML = guidedChartSVG(s);

    if (st) {
      const r1d = v => v == null ? null : +v.toFixed(1);
      hist.unshift({ t: s.startedAt.toISOString(), m: r1d(s.clock / f / 60), k: s.kind,
        hb: st.start == null ? null : Math.round(st.start), ha: st.end == null ? null : Math.round(st.end),
        d5: r1d(st.d5), t10: st.t10 == null ? null : Math.round(st.t10 / f), r0: r1d(r0), r1: r1d(r1) });
      store.set('unfolding-star-history', hist.slice(0, 50));
    }
    renderHistory();
    $('results').hidden = false;
    $('r-close').focus();
  }

  // heart rate (ember) with the breathing rate the pacer set (glow) on the right-hand scale
  function guidedChartSVG(s) {
    const pts = s.samples;
    if (pts.length < 3) return '';
    const Wc = 600, Hc = 150, padL = 34, padR = 44, padT = 10, padB = 20;
    const tMax = s.clock || 1;
    let lo = Math.floor(Math.min(...pts.map(p => p[1])) - 2), hi = Math.ceil(Math.max(...pts.map(p => p[1])) + 2);
    const X = t => padL + (t / tMax) * (Wc - padL - padR);
    const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (Hc - padT - padB);
    const txt = (x, y, anchor, t, fill = 'rgba(228,236,230,0.5)') => `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="10" font-family="IBM Plex Mono, monospace">${t}</text>`;
    let rate = '';
    if (s.rates.length) {
      const rs = s.rates.map(r => r[1]);
      const rlo = Math.floor(Math.min(...rs) - 1), rhi = Math.ceil(Math.max(...rs) + 1);
      const Yr = v => padT + (1 - (v - rlo) / (rhi - rlo)) * (Hc - padT - padB);
      let d = '';
      s.rates.forEach(([t, v], i) => { d += `${i ? 'H' + X(t).toFixed(1) + 'V' : 'M' + X(t).toFixed(1) + ','}${Yr(v).toFixed(1)}`; });
      d += `H${X(s.marks.breathe?.[1] ?? tMax).toFixed(1)}`;
      rate = `<path d="${d}" fill="none" stroke="#9fd4c4" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"/>
        ${txt(Wc - padR + 6, Yr(rhi) + 4, 'start', rhi + '/min', 'rgba(159,212,196,0.7)')}${txt(Wc - padR + 6, Yr(rlo) + 4, 'start', rlo + '/min', 'rgba(159,212,196,0.7)')}`;
    }
    const tap = s.marks.tap;
    const band = tap ? `<rect x="${X(tap[0])}" y="${padT}" width="${Math.max(0, X(tap[1] ?? tMax) - X(tap[0]))}" height="${Hc - padT - padB}" fill="rgba(159,212,196,0.07)"/>
      ${txt((X(tap[0]) + X(tap[1] ?? tMax)) / 2, Hc - 5, 'middle', 'own pace')}` : '';
    const br = s.marks.breathe;
    const lab = br ? txt((X(br[0]) + X(br[1] ?? tMax)) / 2, Hc - 5, 'middle', 'paced') : txt((padL + Wc - padR) / 2, Hc - 5, 'middle', 'resting');
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    return `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Heart rate${s.rates.length ? ' and breathing rate' : ''} during the session">
      ${band}${lab}
      <line x1="${padL}" x2="${Wc - padR}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="rgba(228,236,230,0.08)"/>
      <line x1="${padL}" x2="${Wc - padR}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="rgba(228,236,230,0.08)"/>
      ${txt(padL - 6, Y(hi) + 4, 'end', hi)}${txt(padL - 6, Y(lo) + 4, 'end', lo)}
      ${rate}
      <path d="${line}" fill="none" stroke="#e8a08f" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  }

  // ---- results card
  function showResults(s) {
    if (s.kind === 'adaptive' || s.kind === 'justrest') return showGuidedResults(s);
    const b = rmssd(s.before.rr), a = rmssd(s.after.rr);
    const hb = mean(s.before.bpm), ha = mean(s.after.bpm);
    const minutes = (s.marks.breathe[1] - s.marks.breathe[0]) / 60;
    const hasRR = s.before.rr.length + s.after.rr.length + s.breathe.rr.length > 0;
    const sw = s.swings.map(c => c.swing);
    const swing = median(sw);
    const third = Math.floor(sw.length / 3);
    const early = third >= 2 ? median(sw.slice(0, third)) : null, late = third >= 2 ? median(sw.slice(-third)) : null;

    $('r-when').textContent = s.startedAt.toLocaleString([], { weekday: 'long', hour: '2-digit', minute: '2-digit' })
      + ` · ${fmt(minutes * 60)} breathing · ${s.breaths} breaths`;
    $('r-title').textContent = s.measured ? 'Before and after' : 'Session complete';

    const cell = (v, unit) => v == null ? '<span class="v">—</span>' : `<span class="v">${Math.round(v)}<small>${unit}</small></span>`;
    $('r-compare').innerHTML = s.measured ? `
      <span></span><span class="h">Before</span><span class="h">After</span>
      <span class="k">Resting heart rate</span>${cell(hb, 'bpm')}${cell(ha, 'bpm')}
      ${hasRR ? `<span class="k">HRV (RMSSD)</span>${cell(b?.value, 'ms')}${cell(a?.value, 'ms')}` : ''}` : '';
    $('r-compare').hidden = !s.measured;

    const sign = d => d >= 0 ? '+' : '−';
    const lines = [];
    if (hb != null && ha != null) {
      const d = ha - hb;
      lines.push(`Resting heart rate <span class="${d <= 0 ? 'up' : 'down'}">${sign(d)}${Math.abs(d).toFixed(1)} bpm</span>`);
    }
    if (b && a) {
      const d = a.value - b.value, pct = d / b.value * 100;
      lines.push(`HRV <span class="${d >= 0 ? 'up' : 'down'}">${sign(d)}${Math.abs(d).toFixed(1)} ms (${sign(pct)}${Math.abs(pct).toFixed(0)}%)</span>`);
    }
    if (swing != null) {
      let l = `Breath swing <span class="up">${swing.toFixed(1)} bpm</span> per breath, over ${sw.length} breaths`;
      if (early != null) l += `<br>First third ${early.toFixed(1)} → last third <span class="${late >= early ? 'up' : 'down'}">${late.toFixed(1)} bpm</span>`;
      lines.push(l);
    }
    $('r-delta').innerHTML = lines.join('<br>');
    $('r-delta').hidden = !lines.length;

    const notes = [];
    if (!s.samples.length) notes.push('Connect a heart-rate sensor before you begin to see your heart rate respond to each breath.');
    if (swing != null) notes.push('Breath swing is how far your heart rate rises as you breathe in and falls as you breathe out, taken as the middle value over all breaths. A larger, steadier swing means your breathing is steering your heart rate. It is usually largest with slow, even breathing around 5.5 seconds in and 5.5 out.');
    else if (s.samples.length) notes.push('Not enough heart-rate readings per breath to measure the swing.');
    if (s.samples.length && !hasRR) notes.push('Your band sends heart rate only, about once a second and smoothed, so standard HRV is not available and the swing reads smaller than a chest strap would show. Compare it with your own earlier sessions.');
    else if (s.measured && (!b || !a)) notes.push('Not enough clean heartbeats in one of the rest measurements to calculate HRV. Sit still with the sensor snug, or try 2 minutes.');
    else if (b && a) notes.push(`RMSSD from ${b.beats} and ${a.beats} beats. Short readings vary a lot; compare sessions at the same time of day.`);
    $('r-note').textContent = notes.join(' ') + lagNote(s);

    $('r-chart').innerHTML = chartSVG(s) + cycleSVG(s);

    if (hb != null || swing != null || b) {
      const hist = store.get('unfolding-star-history', []);
      const r1 = v => v == null ? null : +v.toFixed(1);
      hist.unshift({ t: s.startedAt.toISOString(), m: r1(minutes),
        hb: hb == null ? null : Math.round(hb), ha: ha == null ? null : Math.round(ha),
        sw: r1(swing), b: r1(b?.value), a: r1(a?.value) });
      store.set('unfolding-star-history', hist.slice(0, 50));
    }
    renderHistory();
    $('results').hidden = false;
    $('r-close').focus();
  }

  // Average shape of one breath: heart rate relative to each breath's own mean, folded onto 0–100% of the breath.
  function cycleSVG(s) {
    const BINS = 24, acc = new Array(BINS).fill(0), cnt = new Array(BINS).fill(0);
    for (const c of s.swings) {
      const v = s.samples.filter(p => p[0] >= c.t0 && p[0] < c.t1);
      const m = mean(v.map(p => p[1]));
      for (const [t, bpm] of v) {
        const k = Math.min(BINS - 1, Math.floor((t - c.t0) / (c.t1 - c.t0) * BINS));
        acc[k] += bpm - m; cnt[k]++;
      }
    }
    const pts = acc.map((x, k) => cnt[k] ? [(k + 0.5) / BINS, x / cnt[k]] : null).filter(Boolean);
    if (pts.length < 6) return '';
    const Wc = 600, Hc = 120, padL = 34, padR = 8, padT = 22, padB = 20;
    const amp = Math.max(1, Math.ceil(Math.max(...pts.map(p => Math.abs(p[1])))));
    const X = f => padL + f * (Wc - padL - padR);
    const Y = v => padT + (1 - (v + amp) / (2 * amp)) * (Hc - padT - padB);
    const t = (x, y, anchor, txt) => `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="rgba(228,236,230,0.5)" font-size="10" font-family="IBM Plex Mono, monospace">${txt}</text>`;
    const total = s.pattern.reduce((x, p) => x + p[1], 0);
    let at = 0;
    const bands = s.pattern.map(([key, d]) => {
      const x0 = X(at / total); at += d; const x1 = X(at / total);
      const label = { in: 'in', hi: 'hold', out: 'out', ho: 'rest' }[key];
      const fill = key === 'in' ? 'rgba(159,212,196,0.08)' : key === 'hi' ? 'rgba(159,212,196,0.04)' : 'rgba(0,0,0,0)';
      return `<rect x="${x0}" y="${padT}" width="${x1 - x0}" height="${Hc - padT - padB}" fill="${fill}"/>${t((x0 + x1) / 2, Hc - 5, 'middle', label)}`;
    }).join('');
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    return `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Average heart rate across one breath" style="margin-top:14px">
      ${t(padL, 12, 'start', 'AVERAGE BREATH · HEART RATE AROUND ITS MEAN')}
      ${bands}
      <line x1="${padL}" x2="${Wc - padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(228,236,230,0.12)" stroke-dasharray="2 4"/>
      ${t(padL - 6, Y(amp) + 4, 'end', '+' + amp)}${t(padL - 6, Y(0) + 4, 'end', '0')}${t(padL - 6, Y(-amp) + 4, 'end', '−' + amp)}
      <path d="${line}" fill="none" stroke="#e8a08f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function chartSVG(s) {
    const pts = s.samples;
    if (pts.length < 3) return '';
    const Wc = 600, Hc = 130, padL = 34, padR = 8, padT = 10, padB = 20;
    const tMax = pts[pts.length - 1][0] || 1;
    let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
    lo = Math.floor(lo - 2); hi = Math.ceil(hi + 2);
    const X = t => padL + (t / tMax) * (Wc - padL - padR);
    const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (Hc - padT - padB);
    const band = (key, label) => {
      const m = s.marks[key]; if (!m) return '';
      const x0 = X(m[0]), x1 = X(m[1] ?? tMax);
      return `<rect x="${x0}" y="${padT}" width="${Math.max(0, x1 - x0)}" height="${Hc - padT - padB}" fill="rgba(159,212,196,0.07)"/>
        <text x="${(x0 + x1) / 2}" y="${Hc - 5}" text-anchor="middle" fill="rgba(228,236,230,0.5)" font-size="10" font-family="IBM Plex Mono, monospace">${label}</text>`;
    };
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    const m = s.marks.breathe;
    return `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Heart rate during the session">
      ${band('before', 'before')}${band('after', 'after')}
      ${m ? `<text x="${(X(m[0]) + X(m[1] ?? tMax)) / 2}" y="${Hc - 5}" text-anchor="middle" fill="rgba(228,236,230,0.5)" font-size="10" font-family="IBM Plex Mono, monospace">breathing</text>` : ''}
      <line x1="${padL}" x2="${Wc - padR}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="rgba(228,236,230,0.08)"/>
      <line x1="${padL}" x2="${Wc - padR}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="rgba(228,236,230,0.08)"/>
      <text x="${padL - 6}" y="${Y(hi) + 4}" text-anchor="end" fill="rgba(228,236,230,0.5)" font-size="10" font-family="IBM Plex Mono, monospace">${hi}</text>
      <text x="${padL - 6}" y="${Y(lo) + 4}" text-anchor="end" fill="rgba(228,236,230,0.5)" font-size="10" font-family="IBM Plex Mono, monospace">${lo}</text>
      <path d="${line}" fill="none" stroke="#e8a08f" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  }

  function renderHistory() {
    const hist = store.get('unfolding-star-history', []).slice(0, 6);
    if (!hist.length) { $('r-history').innerHTML = ''; return; }
    const pair = (x, y, unit) => x == null || y == null ? '—' : `${x} → ${y} ${unit}`;
    const showHRV = hist.some(h => h.b != null);
    const rows = hist.map(h => {
      const d = new Date(h.t);
      return `<tr><td>${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        <td>${h.m} min${h.k === 'adaptive' ? ' · settle' : h.k === 'justrest' ? ' · rest' : ''}</td><td>${pair(h.hb, h.ha, 'bpm')}</td><td>${h.sw == null ? '—' : h.sw + ' bpm'}</td>
        ${showHRV ? `<td>${pair(h.b, h.a, 'ms')}</td>` : ''}</tr>`;
    }).join('');
    $('r-history').innerHTML = `<table class="history"><thead><tr><th>Recent</th><th>Length</th><th>Heart rate</th><th>Swing</th>${showHRV ? '<th>HRV</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  $('r-close').addEventListener('click', () => { $('results').hidden = true; poke(); });
  $('session').addEventListener('click', () => { session ? endSessionEarly() : beginSession(); poke(); });

  // ---- main loop
  function frame(now) {
    const wall = Math.max(0, (now - last) / 1000); last = now;
    const dt = Math.min(0.1, wall); // animation step; session timing uses wall time so a throttled tab can't stretch a measurement
    const list = phases();
    if (phaseIdx >= list.length) phaseIdx = 0;
    let ph = list[phaseIdx];
    const measuring = session ? session.stage !== 'breathe' : mode() === 'justrest';

    if (running) {
      elapsed += dt;
      if (session) {
        session.clock += wall; session.stageT += wall;
        const dur = session.stages[session.idx].dur;
        if (dur && session.stageT >= dur) nextStage();
        if (session?.ad && session.stage === 'breathe') adaptTick();
      }
      if (!measuring) {
        phaseT += dt;
        while (phaseT >= ph.d) {
          phaseT -= ph.d;
          if (ph.key === 'out') breaths++;
          phaseIdx = (phaseIdx + 1) % list.length;
          ph = list[phaseIdx];
          if (phaseIdx === 0 && session?.stage === 'breathe') { closeCycle(); if (session.ad) onCycle(); }
        }
      }
    }

    // a synthetic heartbeat at the live rate, for the thump on the halo and the corner dot
    let beat = 0;
    if (hr.connected && hr.bpm) {
      hr.beatPhase = (hr.beatPhase + dt * hr.bpm / 60) % 1;
      beat = Math.exp(-hr.beatPhase * 9);
      $('beat').style.opacity = 0.3 + 0.7 * beat;
      $('beat').style.transform = `scale(${0.8 + 0.4 * beat})`;
    }

    const stillMeasuring = session ? session.stage !== 'breathe' : mode() === 'justrest';
    restScene?.show(stillMeasuring, now);
    if (stillMeasuring) {
      if (restScene) { restScene.render(now); ctx.clearRect(0, 0, W, H); }
      else draw(0.04, 0.15, beat);
      if (!session) { setWord(STAGE_WORDS.rest); countEl.textContent = ''; }
      else {
        const dur = session.stages[session.idx].dur, left = dur - session.stageT;
        setWord(running ? STAGE_WORDS[session.stage] : 'paused');
        const time = dur ? fmt(Math.max(0, left)) : fmt(session.stageT);
        countEl.textContent = session.stage === 'tap' ? `${session.taps.length} of 7 taps · ${time}` : `${STAGE_LABELS[session.stage]} · ${time}`;
      }
    } else {
      const raw = unfoldAmount(ph, phaseT / ph.d);
      if (session?.stage === 'breathe' && running && session.clock - (session.paceT ?? -1) >= 0.2) { session.pace.push([session.clock, raw]); session.paceT = session.clock; }
      // settling asks for small breaths, so the figure only opens partway
      const p = mode() === 'adaptive' ? raw * 0.7 : raw;
      demoP = raw;
      if (demoHist) { demoHist.push([now, raw]); if (demoHist.length > 600) demoHist.shift(); }
      const glowAmt = ph.key === 'hi' ? 0.6 + 0.4 * Math.sin(now / 600) : p;
      draw(p, glowAmt, beat * 0.6);
      setWord(running ? ph.word : ($('results').hidden ? 'paused' : 'well done'));
      let c = running ? String(Math.max(1, Math.ceil(ph.d - phaseT))) : '·';
      if (session && running && session.stages[session.idx].dur) c += `   ·   ${fmt(session.stages[session.idx].dur - session.stageT)} left`;
      countEl.textContent = c;
    }
    $('stat').textContent = `${breaths} breath${breaths === 1 ? '' : 's'} · ${fmt(elapsed)}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- controls
  for (const k in sliders) sliders[k].addEventListener('input', () => { manual[k] = sliders[k].value; $('pattern').value = matchPattern(); syncOutputs(); save(); });
  $('shape').addEventListener('change', () => { star = $('shape').value.split(',').map(Number); save(); });
  $('len').addEventListener('change', save);
  $('measure').addEventListener('change', save);
  $('pattern').addEventListener('change', () => {
    const sel = $('pattern').value;
    // leaving Settle heart rate gives the sliders back their own values
    const v = PATTERNS[sel] || (sel === 'custom' ? KEYS.map(k => +manual[k]) : null);
    if (v) { KEYS.forEach((k, i) => { sliders[k].value = v[i]; manual[k] = String(v[i]); }); }
    phaseIdx = 0; phaseT = 0;
    lens[curMode] = $('len').value;
    curMode = mode();
    $('len').value = lens[curMode] ?? (curMode === 'pattern' ? '300' : '600');
    refreshMode(); updateHrStatus(); save();
  });
  $('easy').addEventListener('click', () => { if (session?.ad) easeBack(true); poke(); });
  refreshMode();

  const toggle = () => {
    running = !running;
    $('play').textContent = running ? 'Pause' : 'Resume';
    if (running) $('results').hidden = true;
    poke();
  };
  $('play').addEventListener('click', toggle);

  const fullscreen = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  $('fs').addEventListener('click', fullscreen);
  if (!document.documentElement.requestFullscreen || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) $('fs').hidden = true;
  document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

  addEventListener('keydown', e => {
    if (['SELECT', 'INPUT', 'BUTTON'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); session?.stage === 'tap' ? tapBreath() : toggle(); }
    else if (e.key === 'f' || e.key === 'F') fullscreen();
    else if (e.key === 'Escape' && !$('results').hidden) $('results').hidden = true;
  });
  cv.addEventListener('dblclick', () => { if (session?.stage !== 'tap') fullscreen(); });

  // Controls fade a few seconds after the last interaction. A tap on the background shows them,
  // and tapping the background again while they are visible hides them straight away.
  let idleTimer, lastPointer = 'mouse', wasIdle = false;
  const hideControls = () => { clearTimeout(idleTimer); document.body.classList.add('idle'); };
  const poke = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      // :hover sticks after a tap on touch screens, so only a real mouse can hold the panel open
      if (running && !(lastPointer === 'mouse' && $('panel').matches(':hover'))) hideControls();
      else poke();
    }, 2500);
  };
  addEventListener('pointerdown', e => {
    lastPointer = e.pointerType;
    if (session?.stage === 'tap' && e.target === cv) { tapBreath(); return; }   // taps count breaths; keep the panel away
    wasIdle = document.body.classList.contains('idle');
    poke();
  }, { capture: true, passive: true });
  // pointermove instead of mousemove: touch screens fire fake mouse events after a tap
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse') poke(); }, { passive: true });
  ['keydown', 'input', 'change'].forEach(ev => addEventListener(ev, poke, { passive: true }));
  cv.addEventListener('pointerup', e => { if (session?.stage === 'tap') return; if (e.pointerType !== 'mouse' && !wasIdle && running) hideControls(); });
  poke();

  // keep the screen awake if the browser allows it
  const wake = async () => { try { await navigator.wakeLock?.request('screen'); } catch (e) {} };
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

  // ---- installable app
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  let installPrompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('install').hidden = false; });
  addEventListener('appinstalled', () => { $('install').hidden = true; installPrompt = null; });
  $('install').addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => {});
    installPrompt = null; $('install').hidden = true;
  });

  // test hook: feeds fake heart-rate packets without a sensor (?demo, or ?demo=air for bpm-only like the Fitbit Air)
  if (new URLSearchParams(location.search).has('demo')) {
    const airMode = new URLSearchParams(location.search).get('demo') === 'air';
    window.__showResults = showResults; // lets a test render the results card from a synthetic session
    window.__draw = draw;               // lets a test render a single animation frame
    window.__rest = restScene;          // and a single frame of the rest scene
    hr.connected = true; hr.device = { name: 'Demo sensor' }; $('pulse').hidden = false; demoHist = [];
    window.__session = () => session;   // lets a test inspect the adaptive controller
    $('connect').disabled = true; $('connect').textContent = 'Demo sensor'; refreshMode();
    let t = 0;
    setInterval(() => {
      t += 1;
      const guided = session && session.kind !== 'pattern';
      const base = guided ? 66 + 16 * Math.exp(-session.clock / (150 * session.fast))
        : session?.stage === 'after' ? 60 : session?.stage === 'breathe' ? 63 : 68;
      const bpm = Math.round(base + 4 * Math.sin(t / 5));
      const rr = [60000 / bpm + (Math.random() - 0.5) * (session?.stage === 'after' ? 90 : 50)];
      const buf = new DataView(new ArrayBuffer(airMode ? 3 : 4));
      if (airMode) {
        const then = performance.now() - 3000, old = demoHist.find(q => q[0] >= then);
        const pd = session?.stage === 'breathe' ? (old ? old[1] : demoP) : 0.5;
        buf.setUint8(0, 0x01); buf.setUint16(1, Math.round(base + 6 * (pd - 0.5) + (Math.random() - 0.5) * 2), true);
      } else {
        buf.setUint8(0, 0x10); buf.setUint8(1, bpm); buf.setUint16(2, Math.round(rr[0] * 1024 / 1000), true);
      }
      onHeartRate({ target: { value: buf } });
    }, new URLSearchParams(location.search).has('fast') ? 100 : 1000);
  }
})();
</script>
</body>
</html>
